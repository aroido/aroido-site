<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Why teams should prune unused AI components</title>
  <desc id="desc">An infographic showing the risks of keeping unused AI components, the usage plus dependency cleanup loop, and the benefits teams gain after pruning them with VibeSmith.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1460" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08121D"/>
      <stop offset="0.48" stop-color="#102737"/>
      <stop offset="1" stop-color="#1B4158"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6BE8D8"/>
      <stop offset="1" stop-color="#FF9C6B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#021018" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="40" fill="url(#bg)"/>
  <circle cx="140" cy="120" r="240" fill="#12344B" fill-opacity="0.36"/>
  <circle cx="1490" cy="760" r="280" fill="#0B2232" fill-opacity="0.42"/>

  <text x="96" y="86" fill="#6BE8D8" font-size="24" font-family="'IBM Plex Mono', monospace" letter-spacing="3.2">AROIDO · VIBESMITH</text>
  <text x="96" y="152" fill="#F4F8FB" font-size="56" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700">
    Unused AI components are not passive clutter
  </text>
  <text x="96" y="202" fill="#BDD0DB" font-size="26" font-family="'Space Grotesk', Arial, sans-serif">
    They create search noise, pollute context, and make reuse riskier across repositories.
  </text>

  <g filter="url(#shadow)">
    <rect x="80" y="262" width="420" height="378" rx="30" fill="url(#card)" stroke="rgba(255,255,255,0.12)"/>
    <text x="116" y="316" fill="#FF9C6B" font-size="22" font-family="'IBM Plex Mono', monospace" letter-spacing="2">HIDDEN COSTS</text>
    <text x="116" y="374" fill="#F4F8FB" font-size="36" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700">What dead components do</text>
    <g fill="#DCE7EE" font-size="24" font-family="'Space Grotesk', Arial, sans-serif">
      <text x="116" y="434">1. Search noise</text>
      <text x="116" y="469" fill="#A9C0CC" font-size="20">Humans and agents waste time picking</text>
      <text x="116" y="496" fill="#A9C0CC" font-size="20">between plausible but obsolete files.</text>

      <text x="116" y="548" fill="#DCE7EE" font-size="24">2. Context pollution</text>
      <text x="116" y="583" fill="#A9C0CC" font-size="20">Irrelevant rules and prompts are more</text>
      <text x="116" y="610" fill="#A9C0CC" font-size="20">likely to enter model context or presets.</text>

      <text x="116" y="662" fill="#DCE7EE" font-size="24">3. Unsafe reuse</text>
      <text x="116" y="697" fill="#A9C0CC" font-size="20">Old commands, hooks, or agents get copied</text>
      <text x="116" y="724" fill="#A9C0CC" font-size="20">into the next repo with hidden dependencies.</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="540" y="262" width="520" height="378" rx="30" fill="url(#card)" stroke="rgba(255,255,255,0.12)"/>
    <text x="578" y="316" fill="#6BE8D8" font-size="22" font-family="'IBM Plex Mono', monospace" letter-spacing="2">CLEANUP LOOP</text>
    <text x="578" y="374" fill="#F4F8FB" font-size="36" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700">Usage is the shortlist</text>
    <text x="578" y="410" fill="#BDD0DB" font-size="24" font-family="'Space Grotesk', Arial, sans-serif">Dependency review is the guardrail</text>

    <rect x="578" y="448" width="188" height="116" rx="22" fill="#0E2635" stroke="#4FCFBC" stroke-opacity="0.5"/>
    <text x="607" y="488" fill="#6BE8D8" font-size="18" font-family="'IBM Plex Mono', monospace">STEP 1</text>
    <text x="607" y="528" fill="#F4F8FB" font-size="26" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700">Find low-signal</text>
    <text x="607" y="558" fill="#A9C0CC" font-size="18" font-family="'Space Grotesk', Arial, sans-serif">unused, duplicate, ownerless</text>

    <path d="M792 506H864" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <path d="M846 486L878 506L846 526" stroke="#FF9C6B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="886" y="448" width="136" height="116" rx="22" fill="#1E3B4E" stroke="#FF9C6B" stroke-opacity="0.56"/>
    <text x="910" y="488" fill="#FFB184" font-size="18" font-family="'IBM Plex Mono', monospace">STEP 2</text>
    <text x="910" y="528" fill="#F4F8FB" font-size="26" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700">Check</text>
    <text x="910" y="558" fill="#A9C0CC" font-size="18" font-family="'Space Grotesk', Arial, sans-serif">links and impact</text>

    <text x="578" y="608" fill="#F4F8FB" font-size="24" font-family="'Space Grotesk', Arial, sans-serif">Usage signals you want</text>
    <text x="578" y="642" fill="#A9C0CC" font-size="20" font-family="'Space Grotesk', Arial, sans-serif">• never used recently</text>
    <text x="578" y="672" fill="#A9C0CC" font-size="20" font-family="'Space Grotesk', Arial, sans-serif">• duplicated by newer baseline</text>
    <text x="578" y="702" fill="#A9C0CC" font-size="20" font-family="'Space Grotesk', Arial, sans-serif">• no clear owner or rollout path</text>

    <text x="820" y="608" fill="#F4F8FB" font-size="24" font-family="'Space Grotesk', Arial, sans-serif">Before deleting</text>
    <text x="820" y="642" fill="#A9C0CC" font-size="20" font-family="'Space Grotesk', Arial, sans-serif">• inspect preset or command chains</text>
    <text x="820" y="672" fill="#A9C0CC" font-size="20" font-family="'Space Grotesk', Arial, sans-serif">• check live repo dependencies</text>
    <text x="820" y="702" fill="#A9C0CC" font-size="20" font-family="'Space Grotesk', Arial, sans-serif">• archive first if confidence is low</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1100" y="262" width="420" height="378" rx="30" fill="url(#card)" stroke="rgba(255,255,255,0.12)"/>
    <text x="1138" y="316" fill="#6BE8D8" font-size="22" font-family="'IBM Plex Mono', monospace" letter-spacing="2">WHAT TEAMS GAIN</text>
    <text x="1138" y="374" fill="#F4F8FB" font-size="36" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700">Benefits after pruning</text>
    <g fill="#DCE7EE" font-size="24" font-family="'Space Grotesk', Arial, sans-serif">
      <text x="1138" y="434">Cleaner search</text>
      <text x="1138" y="469" fill="#A9C0CC" font-size="20">Fewer stale hits, faster decisions</text>

      <text x="1138" y="528" fill="#DCE7EE" font-size="24">Lower context noise</text>
      <text x="1138" y="563" fill="#A9C0CC" font-size="20">Less irrelevant material enters prompts</text>

      <text x="1138" y="622" fill="#DCE7EE" font-size="24">Safer reuse</text>
      <text x="1138" y="657" fill="#A9C0CC" font-size="20">New repos inherit cleaner baselines</text>

      <text x="1138" y="716" fill="#DCE7EE" font-size="24">More credible standards</text>
      <text x="1138" y="751" fill="#A9C0CC" font-size="20">People can tell what is actually current</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="684" width="1440" height="156" rx="30" fill="rgba(10, 22, 33, 0.88)" stroke="rgba(255,255,255,0.12)"/>
    <text x="120" y="730" fill="#F4F8FB" font-size="28" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700">VibeSmith cleanup workflow</text>

    <g font-family="'Space Grotesk', Arial, sans-serif">
      <rect x="120" y="754" width="236" height="54" rx="16" fill="#12344A"/>
      <text x="146" y="789" fill="#DCE7EE" font-size="24" font-weight="700">Dashboard</text>
      <text x="438" y="789" fill="#6BE8D8" font-size="28" font-weight="700">→</text>

      <rect x="486" y="754" width="236" height="54" rx="16" fill="#12344A"/>
      <text x="512" y="789" fill="#DCE7EE" font-size="24" font-weight="700">Inventory</text>
      <text x="804" y="789" fill="#6BE8D8" font-size="28" font-weight="700">→</text>

      <rect x="852" y="754" width="236" height="54" rx="16" fill="#12344A"/>
      <text x="878" y="789" fill="#DCE7EE" font-size="24" font-weight="700">Dependency graph</text>
      <text x="1170" y="789" fill="#6BE8D8" font-size="28" font-weight="700">→</text>

      <rect x="1218" y="754" width="236" height="54" rx="16" fill="#3A2A22"/>
      <text x="1244" y="789" fill="#FFE0D0" font-size="24" font-weight="700">Archive or remove</text>
    </g>
  </g>

  <text x="96" y="872" fill="#93A9B5" font-size="18" font-family="'IBM Plex Mono', monospace">
    Sources cited in post: Anthropic long-context guidance, Cursor Rules docs, Google Research on code search and semantic code queries, 2026 AGENTS.md studies.
  </text>
</svg>
